<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPower - Panel de Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body class="negroint">

    <header>
        <nav class="navbar align-items-center" style="background-color:#2BFF52;">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><img src="../assets/logos/FD2.png" alt="FitPower" height="40"></a>
                <div class="d-flex align-items-center text-dark jost">
                    <span id="usuarioNombre" class="me-3 fw-bold"></span>
                    <button class="btn btn-sm btn-dark me-2" data-bs-toggle="modal" data-bs-target="#modalPassword">Cambiar contraseña</button>
                    <button id="btnLogout" class="btn btn-sm btn-outline-dark">Cerrar sesión</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <h1 class="bebas text-center mb-4">PANEL DE ADMINISTRADOR</h1>

        <!-- ===== USUARIOS Y ENTRENADORES ===== -->
        <section class="mb-5">
            <h2 class="bebas">Usuarios y entrenadores</h2>

            <div class="d-flex gap-2 mb-3 jost">
                <select id="filtroRol" class="form-select" style="max-width:220px"></select>
            </div>

            <div class="table-responsive">
                <table class="table table-dark table-striped align-middle" id="tablaUsuarios">
                    <thead>
                        <tr><th>ID Persona</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Especialidad</th><th></th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- ===== PAGOS ===== -->
        <section class="mb-5">
            <h2 class="bebas">Pagos</h2>

            <form id="formFiltroPagos" class="d-flex gap-2 mb-3 jost">
                <input type="number" id="filtroPersonaPagos" class="form-control" style="max-width:220px" placeholder="Filtrar por ID de persona">
                <button type="submit" class="btn btn-outline-light">Filtrar</button>
            </form>

            <form id="formCrearPago" class="row g-2 mb-3 jost">
                <div class="col-md-3">
                    <input type="number" id="nuevoPagoPersona" class="form-control" placeholder="ID de persona" required>
                </div>
                <div class="col-md-3">
                    <input type="number" id="nuevoPagoMonto" class="form-control" placeholder="Monto" required>
                </div>
                <div class="col-md-3">
                    <input type="text" id="nuevoPagoMetodo" class="form-control" placeholder="Método de pago">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn verdeint text-dark w-100">Registrar pago</button>
                </div>
            </form>
            <div id="msgPagos"></div>

            <div class="table-responsive">
                <table class="table table-dark table-striped align-middle" id="tablaPagos">
                    <thead>
                        <tr><th>ID Persona</th><th>Email</th><th>Monto</th><th>Fecha</th><th>Método</th><th></th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- ===== PUNTOS ===== -->
        <section class="mb-5">
            <h2 class="bebas">Puntos</h2>

            <form id="formFiltroPuntos" class="d-flex gap-2 mb-3 jost">
                <input type="number" id="filtroPersonaPuntos" class="form-control" style="max-width:220px" placeholder="Filtrar por ID de persona">
                <button type="submit" class="btn btn-outline-light">Filtrar</button>
            </form>

            <form id="formAgregarPuntos" class="row g-2 mb-3 jost">
                <div class="col-md-3">
                    <input type="number" id="nuevoPuntoPersona" class="form-control" placeholder="ID de persona" required>
                </div>
                <div class="col-md-3">
                    <input type="number" id="nuevoPuntoCantidad" class="form-control" placeholder="Cantidad (+/-)" required>
                </div>
                <div class="col-md-4">
                    <input type="text" id="nuevoPuntoDescripcion" class="form-control" placeholder="Descripción (opcional)">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn verdeint text-dark w-100">Agregar</button>
                </div>
            </form>
            <div id="msgPuntos"></div>

            <div class="table-responsive">
                <table class="table table-dark table-striped align-middle" id="tablaPuntos">
                    <thead>
                        <tr><th>ID Persona</th><th>Email</th><th>Cantidad</th><th>Origen</th><th>Fecha</th><th></th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal: editar usuario -->
    <div class="modal fade" id="modalEditarUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content negroint jost">
                <div class="modal-header">
                    <h5 class="modal-title bebas">Editar usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarUsuario">
                        <label class="form-label small">Nombre</label>
                        <input type="text" id="editUsuarioNombre" class="form-control mb-2" required>

                        <label class="form-label small">Email</label>
                        <input type="email" id="editUsuarioEmail" class="form-control mb-2" required>

                        <label class="form-label small">Especialidad (solo entrenadores)</label>
                        <input type="text" id="editUsuarioEspecialidad" class="form-control mb-2">

                        <label class="form-label small">Rol</label>
                        <select id="editUsuarioRol" class="form-select mb-3"></select>

                        <button type="submit" class="btn verdeint text-dark w-100">Guardar cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: cambiar contraseña -->
    <div class="modal fade" id="modalPassword" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content negroint jost">
                <div class="modal-header">
                    <h5 class="modal-title bebas">Cambiar contraseña</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="cambiarPassForm">
                        <input type="password" id="passActual" class="form-control mb-2" placeholder="Contraseña actual" required>
                        <input type="password" id="passNueva" class="form-control mb-2" placeholder="Contraseña nueva (mín. 6 caracteres)" required>
                        <button type="submit" class="btn verdeint text-dark w-100">Actualizar</button>
                        <div id="cambiarPassMsg"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/Administrador/admin.js"></script>
</body>
</html>
