<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPower - Panel de Entrenador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body class="negroint">

    <header>
        <nav class="navbar align-items-center" style="background-color:#2BFF52;">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><img src="../assets/logos/FD2.png" alt="FitPower" height="40"></a>
                <div class="d-flex align-items-center text-dark jost">
                    <span id="usuarioNombre" class="me-3 fw-bold"></span>
                    <button class="btn btn-sm btn-dark me-2" data-bs-toggle="modal" data-bs-target="#modalPassword">Cambiar contraseña</button>
                    <button id="btnLogout" class="btn btn-sm btn-outline-dark">Cerrar sesión</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <h1 class="bebas text-center mb-4">PANEL DE ENTRENADOR</h1>

        <!-- ===== CLIENTES ===== -->
        <section class="mb-5">
            <h2 class="bebas">Mis clientes <span class="badge verdeint text-dark" id="cantidadClientes">0</span></h2>

            <form id="formAsignarCliente" class="d-flex gap-2 mb-3 jost flex-wrap">
                <input type="number" id="inputIdCliente" class="form-control" style="max-width:220px" placeholder="ID de persona (cliente)" required>
                <button type="submit" class="btn verdeint text-dark">Asignar cliente</button>
            </form>
            <div id="msgClientes"></div>

            <div class="table-responsive">
                <table class="table table-dark table-striped align-middle" id="tablaClientes">
                    <thead>
                        <tr><th>Nombre</th><th>Email</th><th>Asignado desde</th><th></th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- ===== FICHA DEL CLIENTE SELECCIONADO ===== -->
        <section id="panelFicha" class="d-none">
            <h2 class="bebas">Ficha de <span id="fichaClienteNombre" class="verdeint-text"></span></h2>

            <!-- Actividad / peso -->
            <div class="mb-4">
                <h3 class="bebas fs-4">Ejercicios y peso levantado</h3>

                <form id="formNuevaActividad" class="row g-2 mb-3 jost">
                    <div class="col-md-3">
                        <select id="actividadEjercicio" class="form-select"></select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" id="actividadFecha" class="form-control" title="Fecha">
                    </div>
                    <div class="col-md-2">
                        <input type="number" id="actividadSeries" class="form-control" placeholder="Series" min="1" value="1">
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.5" id="actividadPeso" class="form-control" placeholder="Peso (kg)">
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn verdeint text-dark w-100">Registrar</button>
                    </div>
                </form>
                <div id="msgActividad"></div>

                <div class="table-responsive">
                    <table class="table table-dark table-striped align-middle" id="tablaActividad">
                        <thead>
                            <tr><th>Ejercicio</th><th>Fecha</th><th>Series</th><th>Peso</th><th>Calorías</th><th></th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Rutinas del cliente -->
            <div class="mb-4">
                <h3 class="bebas fs-4">Rutinas asignadas</h3>

                <form id="formAsignarRutinaExistente" class="d-flex gap-2 mb-3 jost flex-wrap">
                    <select id="rutinaExistenteSelect" class="form-select" style="max-width:320px"></select>
                    <button type="submit" class="btn verdeint text-dark">Asignar al cliente</button>
                </form>
                <div id="msgRutinas"></div>

                <div class="table-responsive">
                    <table class="table table-dark table-striped align-middle" id="tablaRutinasCliente">
                        <thead>
                            <tr><th>Nombre</th><th>Días</th><th></th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ===== CREAR NUEVA RUTINA (catálogo general) ===== -->
        <section class="mb-5">
            <h2 class="bebas fs-4">Crear nueva rutina</h2>
            <form id="formCrearRutina" class="row g-2 jost">
                <div class="col-md-4">
                    <input type="text" id="rutinaNombre" class="form-control" placeholder="Nombre de la rutina" required>
                </div>
                <div class="col-md-4">
                    <input type="text" id="rutinaDias" class="form-control" placeholder="Días (ej: Lun,Mie,Vie)">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn verdeint text-dark w-100">Crear rutina</button>
                </div>
            </form>
        </section>
    </main>

    <!-- Modal: detalle de rutina (ejercicios que la componen) -->
    <div class="modal fade" id="modalDetalleRutina" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content negroint jost">
                <div class="modal-header">
                    <h5 class="modal-title bebas" id="detalleRutinaNombre"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formAgregarEjercicioRutina" class="d-flex gap-2 mb-3">
                        <select id="rutinaEjercicioSelect" class="form-select"></select>
                        <button type="submit" class="btn verdeint text-dark">Agregar</button>
                    </form>

                    <table class="table table-dark table-striped align-middle" id="tablaEjerciciosRutina">
                        <thead><tr><th>Ejercicio</th><th>Grupo muscular</th><th></th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: cambiar contraseña -->
    <div class="modal fade" id="modalPassword" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content negroint jost">
                <div class="modal-header">
                    <h5 class="modal-title bebas">Cambiar contraseña</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="cambiarPassForm">
                        <input type="password" id="passActual" class="form-control mb-2" placeholder="Contraseña actual" required>
                        <input type="password" id="passNueva" class="form-control mb-2" placeholder="Contraseña nueva (mín. 6 caracteres)" required>
                        <button type="submit" class="btn verdeint text-dark w-100">Actualizar</button>
                        <div id="cambiarPassMsg"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/Entrenador/entrenador.js"></script>
</body>
</html>
